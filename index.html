<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日藥指南 | 日本藥妝與常備藥知識分享</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sakura: { 50: '#fdf2f8', 100: '#fce7f3', 500: '#ec4899', 600: '#db2777' },
                        medical: { 50: '#f0fdf4', 500: '#22c55e', 600: '#16a34a' } 
                    },
                    fontFamily: { sans: ['"Noto Sans TC"', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .hover-card { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .hover-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        html { scroll-behavior: smooth; }
        .content-section { scroll-margin-top: 100px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .admin-sidebar-active { background-color: #ec4899; color: white; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect, useCallback, useMemo } = React;

        const ADMIN_HASH = "d5dbb48255049debcaa47af8d5ea8debe852462925c650a75b3756614e7ab1c6";
        const APP_ID = "nippondrug";

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message.toLowerCase().trim());
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // --- 視圖：後台登入畫面 ---
        const AdminLoginView = ({ setView, authError }) => {
            const [isLoading, setIsLoading] = useState(false);
            const [localError, setLocalError] = useState('');

            const handleGoogleLogin = async () => {
                setIsLoading(true);
                setLocalError('');
                const auth = getAuth();
                const provider = new GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                
                try {
                    await signInWithPopup(auth, provider);
                } catch (e) {
                    setLocalError('登入過程發生錯誤：' + e.message);
                    setIsLoading(false);
                }
            };

            const displayError = authError || localError;

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col justify-center py-12 px-4">
                    <div className="sm:mx-auto sm:w-full sm:max-w-md text-center">
                        <div className="flex justify-center mb-6 text-sakura-500 text-6xl">
                            <i className="fa-solid fa-shield-halved"></i>
                        </div>
                        <h2 className="text-3xl font-black text-slate-900 mb-2">管理員身分確認</h2>
                        <p className="text-slate-500 mb-8">請使用授權的 Google 帳號進行登入</p>
                        
                        <div className="bg-white py-10 px-6 shadow-xl rounded-2xl border border-slate-200">
                            <button 
                                onClick={handleGoogleLogin}
                                disabled={isLoading}
                                className="w-full flex items-center justify-center gap-3 bg-white border border-slate-300 text-slate-700 font-bold py-3 px-4 rounded-lg hover:bg-slate-50 transition shadow-sm disabled:opacity-50"
                            >
                                {isLoading ? (
                                    <i className="fa-solid fa-circle-notch fa-spin"></i>
                                ) : (
                                    <img src="https://www.gstatic.com/images/branding/product/1x/googleg_48dp.png" className="w-5 h-5" />
                                )}
                                使用 Google 帳號登入
                            </button>
                            
                            {displayError && (
                                <div className="mt-4 p-4 bg-red-50 text-red-600 text-sm rounded-lg border border-red-100 text-left">
                                    <p className="font-bold flex items-center mb-2">
                                        <i className="fa-solid fa-circle-exclamation mr-2"></i> 身分驗證未通過
                                    </p>
                                    <p className="whitespace-pre-wrap break-all opacity-80 leading-relaxed">{displayError}</p>
                                </div>
                            )}
                            
                            <div className="mt-8 pt-6 border-t border-slate-100">
                                <button onClick={() => setView('home')} className="text-slate-400 hover:text-sakura-500 text-sm font-medium">
                                    <i className="fa-solid fa-arrow-left mr-1"></i> 返回前台首頁
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 視圖：前台首頁 ---
        const HomeView = ({ products, setView, setActiveProduct }) => (
            <div className="animate-in fade-in duration-500">
                <header className="relative pt-32 pb-24 overflow-hidden bg-sakura-50">
                    <div className="max-w-7xl mx-auto px-4 text-center">
                        <span className="text-sakura-500 font-semibold tracking-wider text-sm mb-4 block uppercase tracking-widest">專業解析，安心用藥</span>
                        <h1 className="text-4xl md:text-5xl font-black text-slate-900 mb-6 leading-tight">
                            日本藥妝知識庫 <br/>
                            <span className="text-transparent bg-clip-text bg-gradient-to-r from-sakura-500 to-orange-400">成分解析與購藥指南</span>
                        </h1>
                    </div>
                </header>

                <section className="py-16 bg-white min-h-screen">
                    <div className="max-w-7xl mx-auto px-4 text-center mb-10">
                        <h2 className="text-2xl font-bold text-slate-900 mb-2">藥品解析目錄</h2>
                        <div className="w-12 h-1 bg-sakura-500 mx-auto rounded-full"></div>
                    </div>
                    <div className="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-8">
                        {products.map(product => (
                            <article key={product.id} onClick={() => { setActiveProduct(product); setView('productDetail'); }} 
                                     className="bg-white rounded-2xl overflow-hidden shadow-sm hover-card border border-slate-100 flex flex-col cursor-pointer">
                                <div className="relative h-52 overflow-hidden bg-slate-50 flex justify-center items-center p-4 border-b border-slate-100">
                                    <img src={product.image || "https://via.placeholder.com/300?text=No+Image"} alt={product.name} className="max-h-full object-contain rounded" />
                                    <div className="absolute top-4 left-4 bg-orange-500 text-white text-xs font-bold px-2 py-1 rounded shadow-sm">
                                        {product.classification}
                                    </div>
                                </div>
                                <div className="p-6 flex-grow flex flex-col">
                                    <div className="text-xs font-bold text-slate-400 mb-1">{product.brand}</div>
                                    <h3 className="text-xl font-bold text-slate-900 mb-2 hover:text-sakura-500 line-clamp-2">{product.name}</h3>
                                    <p className="text-slate-600 text-sm line-clamp-3 mt-auto italic">{product.description}</p>
                                </div>
                            </article>
                        ))}
                        {products.length === 0 && (
                            <div className="col-span-full text-center py-20 text-slate-400 italic">目前尚無藥品資料，請進入後台新增</div>
                        )}
                    </div>
                </section>
            </div>
        );

        // --- 視圖：前台詳細頁 ---
        const ProductDetailView = ({ product, setView }) => {
            if(!product) return null;
            const parsedIngredients = product.ingredientsText ? product.ingredientsText.split('\n').filter(line => line.trim()).map(line => {
                const parts = line.split('|');
                return { name: parts[0] || '', amount: parts[1] || '', desc: parts[2] || '' };
            }) : [];
            const parsedWarnings = product.warnings ? product.warnings.split('\n').filter(w => w.trim()) : [];
            return (
                <div className="bg-slate-50 min-h-screen animate-in slide-in-from-bottom-4 duration-500">
                    <div className="pt-24 pb-4 max-w-7xl mx-auto px-4">
                        <button onClick={() => setView('home')} className="text-sm text-slate-500 hover:text-sakura-500 flex items-center font-bold">
                            <i className="fa-solid fa-arrow-left mr-2"></i> 返回目錄
                        </button>
                    </div>
                    <section className="max-w-7xl mx-auto px-4 mb-8">
                        <div className="bg-white rounded-3xl p-6 md:p-10 shadow-sm border border-slate-100 flex flex-col md:flex-row gap-10">
                            <div className="w-full md:w-2/5 flex items-center justify-center p-8 bg-slate-50 rounded-2xl">
                                <img src={product.image || "https://via.placeholder.com/300?text=No+Image"} className="max-h-[300px] object-contain rounded-lg" />
                            </div>
                            <div className="w-full md:w-3/5">
                                <div className="text-sm font-bold text-slate-400 mb-2 uppercase tracking-widest">{product.brand}</div>
                                <h1 className="text-3xl md:text-4xl font-black text-slate-900 mb-4">{product.name}</h1>
                                <div className="bg-orange-500 text-white text-xs font-black px-3 py-1 inline-block rounded mb-6 shadow-sm">{product.classification}</div>
                                <p className="text-slate-700 leading-relaxed mb-6 font-medium">{product.description}</p>
                                {product.alert && (
                                    <div className="bg-red-50 border-l-4 border-red-500 p-4 rounded-r-lg shadow-sm">
                                        <p className="text-red-700 text-sm font-bold flex items-center">
                                            <i className="fa-solid fa-circle-exclamation mr-2"></i> 安全警語：{product.alert}
                                        </p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </section>
                    <div className="max-w-7xl mx-auto px-4 pb-20 grid grid-cols-1 lg:grid-cols-3 gap-8 text-sm">
                        <div className="lg:col-span-2 space-y-8">
                            <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                                <h3 className="text-xl font-black mb-6 flex items-center text-slate-800 underline decoration-sakura-500 underline-offset-8">
                                    <i className="fa-solid fa-pills text-sakura-500 mr-3"></i> 成分深度解析
                                </h3>
                                <div className="overflow-hidden border border-slate-100 rounded-xl">
                                    <table className="w-full text-left">
                                        <thead className="bg-slate-50 text-slate-500 text-xs font-black">
                                            <tr><th className="p-4">成分名稱</th><th className="p-4 text-right">含量</th><th className="p-4">作用說明</th></tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-50">
                                            {parsedIngredients.map((ing, i) => (
                                                <tr key={i} className="hover:bg-slate-50/50 transition-colors">
                                                    <td className="p-4 font-bold text-slate-800">{ing.name}</td>
                                                    <td className="p-4 text-right font-black text-sakura-500">{ing.amount}</td>
                                                    <td className="p-4 text-slate-500 leading-relaxed">{ing.desc}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <div className="bg-sakura-50 p-8 rounded-3xl border border-sakura-100 shadow-inner">
                                <h3 className="text-lg font-black mb-3 flex items-center text-sakura-700">
                                    <i className="fa-solid fa-clock mr-3"></i> 用法用量與建議
                                </h3>
                                <p className="text-slate-700 leading-relaxed font-bold">{product.dosage}</p>
                            </div>
                        </div>
                        <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 h-fit">
                            <h3 className="text-lg font-black mb-4 flex items-center text-red-600 border-b pb-2 border-red-50">
                                <i className="fa-solid fa-ban mr-3"></i> 禁忌與不適用對象
                            </h3>
                            <ul className="space-y-3">
                                {parsedWarnings.map((w, i) => (
                                    <li key={i} className="flex items-start gap-3 text-slate-600 font-medium">
                                        <i className="fa-solid fa-xmark text-red-400 mt-1"></i>
                                        <span>{w}</span>
                                    </li>
                                ))}
                            </ul>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 視圖：通用列表管理元件 (用於品牌、類型、成分) ---
        const GenericDataManager = ({ title, collectionName, items }) => {
            const [inputValue, setInputValue] = useState('');
            const handleAdd = async (e) => {
                e.preventDefault();
                if (!inputValue.trim()) return;
                const collRef = collection(window.db, 'artifacts', APP_ID, 'public', 'data', collectionName);
                try {
                    await addDoc(collRef, { name: inputValue.trim(), createdAt: Date.now() });
                    setInputValue('');
                } catch (e) { alert("新增失敗"); }
            };
            const handleDelete = async (id) => {
                if(confirm(`確定刪除此${title}？`)) {
                    await deleteDoc(doc(window.db, 'artifacts', APP_ID, 'public', 'data', collectionName, id));
                }
            };

            return (
                <div className="bg-white rounded-2xl p-8 shadow-md border border-slate-200">
                    <h2 className="text-2xl font-black text-slate-800 mb-6">{title}管理庫</h2>
                    <form onSubmit={handleAdd} className="flex gap-3 mb-8">
                        <input 
                            placeholder={`輸入新${title}名稱...`} 
                            value={inputValue} 
                            onChange={e => setInputValue(e.target.value)}
                            className="flex-grow border-2 border-slate-100 p-3 rounded-xl focus:border-sakura-500 outline-none transition font-bold"
                        />
                        <button type="submit" className="bg-sakura-500 text-white px-6 py-2.5 rounded-xl font-black shadow-lg hover:bg-sakura-600 transition">快速建立</button>
                    </form>
                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                        {items.map(item => (
                            <div key={item.id} className="bg-slate-50 border border-slate-100 p-3 rounded-xl flex justify-between items-center group hover:border-sakura-200 transition">
                                <span className="font-bold text-slate-700">{item.name}</span>
                                <button onClick={() => handleDelete(item.id)} className="text-red-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <i className="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        ))}
                        {items.length === 0 && <div className="col-span-full text-center py-10 text-slate-400 italic">目前尚無資料</div>}
                    </div>
                </div>
            );
        };

        // --- 視圖：後台管理介面 (專業儀表板版) ---
        const AdminDashboard = ({ products, brands, categories, ingredients, setView }) => {
            const [activeTab, setActiveTab] = useState('products');
            const [formData, setFormData] = useState(null);
            
            const handleSignOut = useCallback(() => {
                signOut(getAuth()).then(() => window.location.reload());
            }, []);

            const handleSave = async (e) => {
                e.preventDefault();
                const collRef = collection(window.db, 'artifacts', APP_ID, 'public', 'data', 'products');
                try {
                    if (formData.id) {
                        const docRef = doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'products', formData.id);
                        await updateDoc(docRef, formData);
                    } else {
                        await addDoc(collRef, { ...formData, createdAt: Date.now() });
                    }
                    setFormData(null);
                } catch (error) { alert("儲存失敗"); }
            };

            const handleDelete = async (id) => {
                if(confirm("確定要永久刪除這筆藥品資料嗎？")) {
                    await deleteDoc(doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'products', id));
                }
            };

            return (
                <div className="min-h-screen bg-slate-100 flex animate-in fade-in duration-300">
                    {/* 專業側邊欄 */}
                    <aside className="w-64 bg-slate-900 text-slate-400 flex flex-col sticky top-0 h-screen shadow-2xl">
                        <div className="p-6 mb-4">
                            <div className="font-black text-sakura-500 text-xl flex items-center gap-2">
                                <i className="fa-solid fa-user-shield"></i> 日藥後台系統
                            </div>
                            <div className="text-[10px] uppercase tracking-widest mt-1 opacity-50 font-bold">Admin Management</div>
                        </div>
                        
                        <nav className="flex-grow px-4 space-y-2">
                            <button onClick={() => { setActiveTab('products'); setFormData(null); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition font-bold ${activeTab === 'products' ? 'admin-sidebar-active' : 'hover:bg-slate-800 hover:text-white'}`}>
                                <i className="fa-solid fa-pills w-5"></i> 藥品資料庫
                            </button>
                            <div className="pt-4 pb-2 px-4 text-[10px] font-black text-slate-600 uppercase tracking-widest">基礎資料維護</div>
                            <button onClick={() => setActiveTab('brands')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition font-bold ${activeTab === 'brands' ? 'admin-sidebar-active' : 'hover:bg-slate-800 hover:text-white'}`}>
                                <i className="fa-solid fa-building w-5"></i> 藥廠品牌
                            </button>
                            <button onClick={() => setActiveTab('categories')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition font-bold ${activeTab === 'categories' ? 'admin-sidebar-active' : 'hover:bg-slate-800 hover:text-white'}`}>
                                <i className="fa-solid fa-tags w-5"></i> 產品類型
                            </button>
                            <button onClick={() => setActiveTab('ingredients')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition font-bold ${activeTab === 'ingredients' ? 'admin-sidebar-active' : 'hover:bg-slate-800 hover:text-white'}`}>
                                <i className="fa-solid fa-vial w-5"></i> 成分清單庫
                            </button>
                        </nav>

                        <div className="p-4 border-t border-slate-800">
                            <button onClick={() => setView('home')} className="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold hover:bg-slate-800 transition mb-2">
                                <i className="fa-solid fa-eye"></i> 前台預覽
                            </button>
                            <button onClick={handleSignOut} className="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-red-400 hover:bg-red-500/10 transition">
                                <i className="fa-solid fa-right-from-bracket"></i> 登出系統
                            </button>
                        </div>
                    </aside>

                    {/* 主內容區 */}
                    <main className="flex-grow p-10 overflow-y-auto h-screen no-scrollbar">
                        {activeTab === 'products' && (
                            !formData ? (
                                <div className="bg-white rounded-2xl p-8 shadow-md border border-slate-200">
                                    <div className="flex justify-between items-center mb-8">
                                        <div>
                                            <h2 className="text-2xl font-black text-slate-800">藥品目錄清單</h2>
                                            <p className="text-slate-400 text-sm font-medium">管理所有在前台展示的藥妝產品資訊</p>
                                        </div>
                                        <button onClick={() => setFormData({brand:"",name:"",category:"常備藥",classification:"第2類醫藥品",image:"",price:"",tags:"",description:"",alert:"",ingredientsText:"",dosage:"",warnings:"",pharmacist:""})} className="bg-sakura-500 text-white px-6 py-2.5 rounded-xl font-black shadow-lg hover:bg-sakura-600 transition">+ 新增藥品</button>
                                    </div>
                                    <div className="divide-y divide-slate-100">
                                        {products.map(p => (
                                            <div key={p.id} className="py-5 flex justify-between items-center hover:bg-slate-50 px-4 rounded-xl transition group">
                                                <div className="flex items-center gap-4">
                                                    <div className="w-12 h-12 bg-slate-100 rounded-lg overflow-hidden flex items-center justify-center">
                                                        {p.image ? <img src={p.image} className="w-full h-full object-cover" /> : <i className="fa-solid fa-image text-slate-300"></i>}
                                                    </div>
                                                    <div>
                                                        <div className="text-xs font-bold text-slate-400">{p.brand}</div>
                                                        <div className="font-black text-slate-800 text-lg">{p.name}</div>
                                                    </div>
                                                </div>
                                                <div className="flex gap-4">
                                                    <button onClick={() => setFormData(p)} className="text-blue-500 text-sm font-black hover:underline">編輯</button>
                                                    <button onClick={() => handleDelete(p.id)} className="text-red-500 text-sm font-black hover:underline">刪除</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ) : (
                                <form onSubmit={handleSave} className="bg-white rounded-2xl p-8 shadow-xl border border-slate-200 space-y-6">
                                    <div className="flex justify-between items-center border-b pb-4 mb-2">
                                        <h2 className="text-2xl font-black text-slate-800">{formData.id ? '🛠️ 編輯藥品' : '✨ 新增藥品'}</h2>
                                        <button type="button" onClick={() => setFormData(null)} className="text-slate-400 hover:text-slate-800 transition"><i className="fa-solid fa-xmark text-2xl"></i></button>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div>
                                            <label className="block text-xs font-black text-slate-400 mb-2 uppercase tracking-tighter">藥廠品牌 (從資料庫選擇)</label>
                                            <select required value={formData.brand} onChange={e=>setFormData({...formData,brand:e.target.value})} className="w-full border-2 border-slate-100 p-3 rounded-xl focus:border-sakura-500 outline-none transition font-bold bg-slate-50">
                                                <option value="">請選擇品牌...</option>
                                                {brands.map(b => <option key={b.id} value={b.name}>{b.name}</option>)}
                                                {!brands.some(b => b.name === formData.brand) && formData.brand && <option value={formData.brand}>{formData.brand} (自訂)</option>}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-black text-slate-400 mb-2 uppercase tracking-tighter">產品類型</label>
                                            <select required value={formData.classification} onChange={e=>setFormData({...formData,classification:e.target.value})} className="w-full border-2 border-slate-100 p-3 rounded-xl focus:border-sakura-500 outline-none transition font-bold bg-slate-50">
                                                <option value="">請選擇分級...</option>
                                                <option value="第 1 類醫藥品">第 1 類醫藥品</option>
                                                <option value="指定第 2 類醫藥品">指定第 2 類醫藥品</option>
                                                <option value="第 2 類醫藥品">第 2 類醫藥品</option>
                                                <option value="第 3 類醫藥品">第 3 類醫藥品</option>
                                                <option value="醫藥部外品">醫藥部外品</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div>
                                            <label className="block text-xs font-black text-slate-400 mb-2 uppercase tracking-tighter">藥品名稱</label>
                                            <input placeholder="輸入名稱..." value={formData.name} onChange={e=>setFormData({...formData,name:e.target.value})} className="w-full border-2 border-slate-100 p-3 rounded-xl focus:border-sakura-500 outline-none transition font-bold" required />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-black text-slate-400 mb-2 uppercase tracking-tighter">圖片連結 (URL)</label>
                                            <input placeholder="https://..." value={formData.image} onChange={e=>setFormData({...formData,image:e.target.value})} className="w-full border-2 border-slate-100 p-3 rounded-xl focus:border-sakura-500 outline-none transition font-bold" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-black text-slate-400 mb-2 uppercase tracking-tighter">成分科學解析 (格式：名稱|劑量|說明)</label>
                                        <div className="mb-2 flex flex-wrap gap-2">
                                            {ingredients.slice(0, 8).map(i => (
                                                <button key={i.id} type="button" onClick={() => setFormData({...formData, ingredientsText: (formData.ingredientsText ? formData.ingredientsText + '\n' : '') + i.name + '|含量|機轉說明'})} className="text-[10px] bg-slate-100 hover:bg-sakura-100 px-2 py-1 rounded-md font-bold text-slate-500 transition">+ {i.name}</button>
                                            ))}
                                            <span className="text-[10px] text-slate-300 self-center">點擊上方成分可快速填入</span>
                                        </div>
                                        <textarea placeholder="例如：布洛芬|150mg|止痛效果" value={formData.ingredientsText} onChange={e=>setFormData({...formData,ingredientsText:e.target.value})} className="w-full border-2 border-slate-50 p-3 rounded-xl font-mono text-xs focus:border-sakura-500 outline-none transition bg-slate-50" rows="5"></textarea>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div>
                                            <label className="block text-xs font-black text-slate-400 mb-2 uppercase tracking-tighter">用法用量建議</label>
                                            <textarea value={formData.dosage} onChange={e=>setFormData({...formData,dosage:e.target.value})} className="w-full border-2 border-slate-100 p-3 rounded-xl focus:border-sakura-500 outline-none transition font-bold" rows="3"></textarea>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-black text-slate-400 mb-2 uppercase tracking-tighter">禁忌對象 (每行一個)</label>
                                            <textarea value={formData.warnings} onChange={e=>setFormData({...formData,warnings:e.target.value})} className="w-full border-2 border-slate-100 p-3 rounded-xl focus:border-sakura-500 outline-none transition font-bold" rows="3"></textarea>
                                        </div>
                                    </div>
                                    <div className="flex justify-end gap-4 pt-6 border-t border-slate-50">
                                        <button type="button" onClick={()=>setFormData(null)} className="px-6 py-2.5 border-2 border-slate-100 rounded-xl font-black text-slate-500">取消</button>
                                        <button type="submit" className="px-10 py-2.5 bg-sakura-500 text-white rounded-xl font-black shadow-xl hover:bg-sakura-600 transition">確定儲存</button>
                                    </div>
                                </form>
                            )
                        )}

                        {activeTab === 'brands' && <GenericDataManager title="藥廠品牌" collectionName="brands" items={brands} />}
                        {activeTab === 'categories' && <GenericDataManager title="產品類型" collectionName="categories" items={categories} />}
                        {activeTab === 'ingredients' && <GenericDataManager title="成分清單" collectionName="ingredients" items={ingredients} />}
                    </main>
                </div>
            );
        };

        // --- 核心 App 元件 ---
        const App = () => {
            const [view, setView] = useState('home');
            const [products, setProducts] = useState([]);
            const [brands, setBrands] = useState([]);
            const [categories, setCategories] = useState([]);
            const [ingredients, setIngredients] = useState([]);
            
            const [activeProduct, setActiveProduct] = useState(null);
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [authError, setAuthError] = useState('');
            const [dbReady, setDbReady] = useState(false);

            useEffect(() => { window.scrollTo(0, 0); }, [view]);

            useEffect(() => {
                const firebaseConfig = {
                    apiKey: "AIzaSyDQ3jh6JLTAEEedCNaev_7wuDzSrX9rdJw",
                    authDomain: "nippondrug.firebaseapp.com",
                    projectId: "nippondrug",
                    storageBucket: "nippondrug.firebasestorage.app",
                    messagingSenderId: "872135164108",
                    appId: "1:872135164108:web:7b7de05ff82f3166400269"
                };
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                window.db = getFirestore(app);

                signInAnonymously(auth).catch(e => console.error(e));

                onAuthStateChanged(auth, async (u) => {
                    if (u && !u.isAnonymous) {
                        const emailHash = await sha256(u.email);
                        if (emailHash === ADMIN_HASH) {
                            setIsAuthenticated(true);
                            setAuthError('');
                            setView('admin');
                        } else {
                            setIsAuthenticated(false);
                            const maskedEmail = u.email.substring(0, 3) + "****";
                            setAuthError(`身分驗證失敗：帳號 ${maskedEmail} 沒有管理員權限。\n\n雜湊值：${emailHash}`);
                            await signOut(auth);
                        }
                    } else {
                        setIsAuthenticated(false);
                    }
                    setDbReady(true);
                });
            }, []);

            // 監聽所有資料集
            useEffect(() => {
                if (!dbReady) return;
                const path = (name) => collection(window.db, 'artifacts', APP_ID, 'public', 'data', name);
                
                const unsubProducts = onSnapshot(path('products'), (snap) => setProducts(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubBrands = onSnapshot(path('brands'), (snap) => setBrands(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubCategories = onSnapshot(path('categories'), (snap) => setCategories(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubIngredients = onSnapshot(path('ingredients'), (snap) => setIngredients(snap.docs.map(d => ({id: d.id, ...d.data()}))));

                return () => { unsubProducts(); unsubBrands(); unsubCategories(); unsubIngredients(); };
            }, [dbReady]);

            const renderContent = () => {
                if (view === 'admin' && isAuthenticated) return <AdminDashboard products={products} brands={brands} categories={categories} ingredients={ingredients} setView={setView} />;
                if (view === 'admin' || view === 'adminLogin') return <AdminLoginView setView={setView} authError={authError} />;
                if (view === 'productDetail') return <ProductDetailView product={activeProduct} setView={setView} />;
                return <HomeView products={products} setView={setView} setActiveProduct={setActiveProduct} />;
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {view !== 'admin' && view !== 'adminLogin' && (
                        <nav className="fixed w-full z-50 top-0 bg-white/90 backdrop-blur shadow-md">
                            <div className="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
                                <div onClick={() => setView('home')} className="cursor-pointer flex items-center group">
                                    <i className="fa-solid fa-leaf text-sakura-500 text-2xl mr-2 group-hover:rotate-12 transition-transform duration-300"></i>
                                    <span className="font-black text-2xl text-slate-800">日藥<span className="text-sakura-500">指南</span></span>
                                </div>
                                <button onClick={() => setView(isAuthenticated ? 'admin' : 'adminLogin')} className={`${isAuthenticated ? 'bg-sakura-500' : 'bg-slate-800'} text-white px-6 py-2.5 rounded-full text-sm font-black shadow-lg hover:scale-105 transition`}>
                                    <i className={`fa-solid ${isAuthenticated ? 'fa-user-shield' : 'fa-gear'} mr-2`}></i> 
                                    {isAuthenticated ? '進入後台' : '管理員入口'}
                                </button>
                            </div>
                        </nav>
                    )}
                    <div className="flex-grow">{renderContent()}</div>
                    <footer className="bg-slate-900 text-slate-500 py-12 text-center text-xs">
                        <p className="font-bold">© 2026 日藥指南專業版 Wa-Cosme Guide</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
