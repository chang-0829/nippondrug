<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日藥指南 | 日本藥妝與常備藥知識分享</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sakura: { 50: '#fdf2f8', 100: '#fce7f3', 500: '#ec4899', 600: '#db2777' },
                        medical: { 50: '#f0fdf4', 500: '#22c55e', 600: '#16a34a' } 
                    },
                    fontFamily: { sans: ['"Noto Sans TC"', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .hover-card { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .hover-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        html { scroll-behavior: smooth; }
        .content-section { scroll-margin-top: 100px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect } = React;

        // --- 雜湊加密函式 (SHA-256) ---
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message.toLowerCase().trim());
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // 你的電郵加密後的 ID (外人無法推算)
        const ADMIN_HASH = "64969299403d5272a27d2c35582f342732a37397e51084b2e6639733796d830b";

        // --- 視圖：後台登入畫面 ---
        const AdminLoginView = ({ setView, setIsAuthenticated, user }) => {
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState('');

            const handleGoogleLogin = async () => {
                setIsLoading(true);
                setError('');
                const auth = getAuth();
                const provider = new GoogleAuthProvider();
                
                try {
                    const result = await signInWithPopup(auth, provider);
                    const emailHash = await sha256(result.user.email);
                    
                    if (emailHash === ADMIN_HASH) {
                        setIsAuthenticated(true);
                        setView('admin');
                    } else {
                        await signOut(auth); // 登出非法帳號
                        setError('身分驗證失敗：您沒有管理員權限。');
                    }
                } catch (e) {
                    setError('登入過程發生錯誤：' + e.message);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col justify-center py-12 px-4">
                    <div className="sm:mx-auto sm:w-full sm:max-w-md text-center">
                        <div className="flex justify-center mb-6 text-sakura-500 text-6xl">
                            <i className="fa-solid fa-shield-halved"></i>
                        </div>
                        <h2 className="text-3xl font-black text-slate-900 mb-2">管理員身分確認</h2>
                        <p className="text-slate-500 mb-8">請使用授權的 Google 帳號進行登入</p>
                        
                        <div className="bg-white py-10 px-6 shadow-xl rounded-2xl border border-slate-200">
                            <button 
                                onClick={handleGoogleLogin}
                                disabled={isLoading}
                                className="w-full flex items-center justify-center gap-3 bg-white border border-slate-300 text-slate-700 font-bold py-3 px-4 rounded-lg hover:bg-slate-50 transition shadow-sm disabled:opacity-50"
                            >
                                {isLoading ? (
                                    <i className="fa-solid fa-circle-notch fa-spin"></i>
                                ) : (
                                    <img src="https://www.gstatic.com/images/branding/product/1x/googleg_48dp.png" className="w-5 h-5" />
                                )}
                                使用 Google 帳號登入
                            </button>
                            
                            {error && (
                                <div className="mt-4 p-3 bg-red-50 text-red-600 text-sm font-bold rounded-lg border border-red-100 italic">
                                    <i className="fa-solid fa-circle-exclamation mr-1"></i> {error}
                                </div>
                            )}
                            
                            <div className="mt-8 pt-6 border-t border-slate-100">
                                <button onClick={() => setView('home')} className="text-slate-400 hover:text-sakura-500 text-sm font-medium">
                                    <i className="fa-solid fa-arrow-left mr-1"></i> 返回前台首頁
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 視圖：前台首頁 (同前) ---
        const HomeView = ({ products, setView, setActiveProduct }) => (
            <div>
                <header className="relative pt-32 pb-24 overflow-hidden bg-sakura-50">
                    <div className="max-w-7xl mx-auto px-4 text-center">
                        <span className="text-sakura-500 font-semibold tracking-wider text-sm mb-4 block uppercase tracking-widest">專業解析，安心用藥</span>
                        <h1 className="text-4xl md:text-5xl font-black text-slate-900 mb-6 leading-tight">
                            日本藥妝知識庫 <br/>
                            <span className="text-transparent bg-clip-text bg-gradient-to-r from-sakura-500 to-orange-400">成分解析與購藥指南</span>
                        </h1>
                    </div>
                </header>

                <section className="py-16 bg-white min-h-screen">
                    <div className="max-w-7xl mx-auto px-4 text-center mb-10">
                        <h2 className="text-2xl font-bold text-slate-900 mb-2">藥品解析目錄</h2>
                        <div className="w-12 h-1 bg-sakura-500 mx-auto rounded-full"></div>
                    </div>
                    <div className="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-8">
                        {products.map(product => (
                            <article key={product.id} onClick={() => { setActiveProduct(product); setView('productDetail'); }} 
                                     className="bg-white rounded-2xl overflow-hidden shadow-sm hover-card border border-slate-100 flex flex-col cursor-pointer">
                                <div className="relative h-52 overflow-hidden bg-slate-50 flex justify-center items-center p-4 border-b border-slate-100">
                                    <img src={product.image} alt={product.name} className="max-h-full object-contain rounded" />
                                    <div className="absolute top-4 left-4 bg-orange-500 text-white text-xs font-bold px-2 py-1 rounded shadow-sm">
                                        {product.classification}
                                    </div>
                                </div>
                                <div className="p-6 flex-grow flex flex-col">
                                    <div className="text-xs font-bold text-slate-400 mb-1">{product.brand}</div>
                                    <h3 className="text-xl font-bold text-slate-900 mb-2 hover:text-sakura-500 line-clamp-2">{product.name}</h3>
                                    <p className="text-slate-600 text-sm line-clamp-3 mt-auto italic">{product.description}</p>
                                </div>
                            </article>
                        ))}
                    </div>
                </section>
            </div>
        );

        // --- 視圖：前台詳細頁 (同前) ---
        const ProductDetailView = ({ product, setView }) => {
            if(!product) return null;
            const parsedIngredients = product.ingredientsText ? product.ingredientsText.split('\n').filter(line => line.trim()).map(line => {
                const parts = line.split('|');
                return { name: parts[0] || '', amount: parts[1] || '', desc: parts[2] || '' };
            }) : [];
            const parsedWarnings = product.warnings ? product.warnings.split('\n').filter(w => w.trim()) : [];
            return (
                <div className="bg-slate-50 min-h-screen">
                    <div className="pt-24 pb-4 max-w-7xl mx-auto px-4">
                        <button onClick={() => setView('home')} className="text-sm text-slate-500 hover:text-sakura-500 flex items-center">
                            <i className="fa-solid fa-arrow-left mr-2"></i> 返回目錄
                        </button>
                    </div>
                    <section className="max-w-7xl mx-auto px-4 mb-8">
                        <div className="bg-white rounded-3xl p-6 md:p-10 shadow-sm border border-slate-100 flex flex-col md:flex-row gap-10">
                            <div className="w-full md:w-2/5 flex items-center justify-center p-8 bg-slate-50 rounded-2xl">
                                <img src={product.image} className="max-h-[300px] object-contain rounded-lg" />
                            </div>
                            <div className="w-full md:w-3/5">
                                <div className="text-sm font-bold text-slate-400 mb-2">{product.brand}</div>
                                <h1 className="text-3xl md:text-4xl font-black text-slate-900 mb-4">{product.name}</h1>
                                <div className="bg-orange-500 text-white text-xs font-bold px-3 py-1 inline-block rounded mb-6">{product.classification}</div>
                                <p className="text-slate-700 leading-relaxed mb-6">{product.description}</p>
                                {product.alert && (
                                    <div className="bg-red-50 border-l-4 border-red-500 p-4 rounded-r-lg">
                                        <p className="text-red-700 text-sm font-bold">⚠️ 安全警語：{product.alert}</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </section>
                    <div className="max-w-7xl mx-auto px-4 pb-20 grid grid-cols-1 lg:grid-cols-3 gap-8 text-sm">
                        <div className="lg:col-span-2 space-y-8">
                            <div className="bg-white p-6 rounded-2xl shadow-sm">
                                <h3 className="text-lg font-bold mb-4 flex items-center"><i className="fa-solid fa-pills text-sakura-500 mr-2"></i> 成分解析</h3>
                                <table className="w-full text-left">
                                    <thead className="bg-slate-50 text-slate-500 text-xs">
                                        <tr><th className="p-3">名稱</th><th className="p-3 text-right">含量</th><th className="p-3">說明</th></tr>
                                    </thead>
                                    <tbody className="divide-y">
                                        {parsedIngredients.map((ing, i) => (
                                            <tr key={i}><td className="p-3 font-bold">{ing.name}</td><td className="p-3 text-right font-bold text-sakura-500">{ing.amount}</td><td className="p-3 text-slate-500">{ing.desc}</td></tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                            <div className="bg-sakura-50 p-6 rounded-2xl border border-sakura-100">
                                <h3 className="text-lg font-bold mb-2 flex items-center"><i className="fa-solid fa-clock text-sakura-500 mr-2"></i> 用法用量</h3>
                                <p className="text-slate-700">{product.dosage}</p>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm h-fit">
                            <h3 className="text-lg font-bold mb-4 flex items-center text-red-600"><i className="fa-solid fa-ban mr-2"></i> 禁忌對象</h3>
                            <ul className="list-disc pl-5 space-y-2 text-slate-600">
                                {parsedWarnings.map((w, i) => <li key={i}>{w}</li>)}
                            </ul>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 視圖：後台管理介面 ---
        const AdminDashboard = ({ products, setView }) => {
            const [formData, setFormData] = useState(null);
            const handleSignOut = () => {
                signOut(getAuth());
                window.location.reload();
            };
            const handleSave = async (e) => {
                e.preventDefault();
                const collRef = collection(window.db, 'products');
                try {
                    if (formData.id) {
                        await updateDoc(doc(window.db, 'products', formData.id), formData);
                    } else {
                        await addDoc(collRef, { ...formData, createdAt: Date.now() });
                    }
                    setFormData(null);
                } catch (error) { alert("儲存失敗"); }
            };
            const handleDelete = async (id) => {
                if(confirm("確定刪除？")) await deleteDoc(doc(window.db, 'products', id));
            };

            return (
                <div className="min-h-screen bg-slate-100">
                    <nav className="bg-slate-900 text-white p-4 flex justify-between items-center sticky top-0 z-50">
                        <div className="font-bold">內容管理系統</div>
                        <div className="flex gap-4">
                            <button onClick={() => setView('home')} className="text-sm bg-slate-700 px-3 py-1 rounded">查看前台</button>
                            <button onClick={handleSignOut} className="text-sm bg-red-600 px-3 py-1 rounded">登出</button>
                        </div>
                    </nav>
                    <div className="max-w-5xl mx-auto p-6">
                        {!formData ? (
                            <div className="bg-white rounded-xl p-6 shadow-sm">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-xl font-bold">產品列表</h2>
                                    <button onClick={() => setFormData({brand:"",name:"",category:"常備藥",classification:"第2類醫藥品",image:"",price:"",tags:"",description:"",alert:"",ingredientsText:"",dosage:"",warnings:"",pharmacist:""})} className="bg-sakura-500 text-white px-4 py-2 rounded-lg font-bold">+ 新增</button>
                                </div>
                                <div className="divide-y">
                                    {products.map(p => (
                                        <div key={p.id} className="py-4 flex justify-between items-center">
                                            <div>
                                                <div className="text-xs text-slate-400">{p.brand}</div>
                                                <div className="font-bold">{p.name}</div>
                                            </div>
                                            <div className="flex gap-4">
                                                <button onClick={() => setFormData(p)} className="text-blue-500 text-sm">編輯</button>
                                                <button onClick={() => handleDelete(p.id)} className="text-red-500 text-sm">刪除</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ) : (
                            <form onSubmit={handleSave} className="bg-white rounded-xl p-6 shadow-sm space-y-4">
                                <h2 className="text-xl font-bold mb-4 border-b pb-2">編輯資料</h2>
                                <div className="grid grid-cols-2 gap-4">
                                    <input placeholder="品牌" value={formData.brand} onChange={e=>setFormData({...formData,brand:e.target.value})} className="border p-2 rounded" required />
                                    <input placeholder="名稱" value={formData.name} onChange={e=>setFormData({...formData,name:e.target.value})} className="border p-2 rounded" required />
                                    <input placeholder="圖片網址" value={formData.image} onChange={e=>setFormData({...formData,image:e.target.value})} className="border p-2 rounded" />
                                    <input placeholder="價格" value={formData.price} onChange={e=>setFormData({...formData,price:e.target.value})} className="border p-2 rounded" />
                                </div>
                                <textarea placeholder="描述" value={formData.description} onChange={e=>setFormData({...formData,description:e.target.value})} className="w-full border p-2 rounded" rows="2"></textarea>
                                <textarea placeholder="成分(名稱|含量|說明)" value={formData.ingredientsText} onChange={e=>setFormData({...formData,ingredientsText:e.target.value})} className="w-full border p-2 rounded font-mono text-xs" rows="4"></textarea>
                                <textarea placeholder="用法" value={formData.dosage} onChange={e=>setFormData({...formData,dosage:e.target.value})} className="w-full border p-2 rounded" rows="2"></textarea>
                                <textarea placeholder="禁忌" value={formData.warnings} onChange={e=>setFormData({...formData,warnings:e.target.value})} className="w-full border p-2 rounded" rows="2"></textarea>
                                <div className="flex justify-end gap-3 pt-4">
                                    <button type="button" onClick={()=>setFormData(null)} className="px-4 py-2 border rounded font-bold">取消</button>
                                    <button type="submit" className="px-6 py-2 bg-sakura-500 text-white rounded font-bold">儲存</button>
                                </div>
                            </form>
                        )}
                    </div>
                </div>
            );
        };

        // --- 核心 App 元件 ---
        const App = () => {
            const [view, setView] = useState('home');
            const [products, setProducts] = useState([]);
            const [activeProduct, setActiveProduct] = useState(null);
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [dbReady, setDbReady] = useState(false);

            useEffect(() => {
                const firebaseConfig = {
                    apiKey: "AIzaSyDQ3jh6JLTAEEedCNaev_7wuDzSrX9rdJw",
                    authDomain: "nippondrug.firebaseapp.com",
                    projectId: "nippondrug",
                    storageBucket: "nippondrug.firebasestorage.app",
                    messagingSenderId: "872135164108",
                    appId: "1:872135164108:web:7b7de05ff82f3166400269"
                };
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                window.db = getFirestore(app);

                signInAnonymously(auth).catch(e => console.error(e));

                onAuthStateChanged(auth, async (u) => {
                    if (u && !u.isAnonymous) {
                        const emailHash = await sha256(u.email);
                        if (emailHash === ADMIN_HASH) {
                            setIsAuthenticated(true);
                        }
                    }
                    setDbReady(true);
                });
            }, []);

            useEffect(() => {
                if (!dbReady) return;
                return onSnapshot(collection(window.db, 'products'), (snapshot) => {
                    setProducts(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                });
            }, [dbReady]);

            const renderContent = () => {
                if (view === 'admin') return <AdminDashboard products={products} setView={setView} />;
                if (view === 'adminLogin') return <AdminLoginView setView={setView} setIsAuthenticated={setIsAuthenticated} />;
                if (view === 'productDetail') return <ProductDetailView product={activeProduct} setView={setView} />;
                return <HomeView products={products} setView={setView} setActiveProduct={setActiveProduct} />;
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {view !== 'admin' && view !== 'adminLogin' && (
                        <nav className="fixed w-full z-50 top-0 bg-white/90 backdrop-blur shadow-sm">
                            <div className="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
                                <div onClick={() => setView('home')} className="cursor-pointer flex items-center">
                                    <i className="fa-solid fa-leaf text-sakura-500 text-2xl mr-2"></i>
                                    <span className="font-bold text-2xl">日藥<span className="text-sakura-500">指南</span></span>
                                </div>
                                <button onClick={() => setView(isAuthenticated ? 'admin' : 'adminLogin')} className="bg-slate-800 text-white px-4 py-2 rounded-full text-sm">
                                    <i className="fa-solid fa-gear mr-1"></i> 後台
                                </button>
                            </div>
                        </nav>
                    )}
                    <div className="flex-grow">{renderContent()}</div>
                    <footer className="bg-slate-900 text-slate-500 py-10 text-center text-xs">
                        <p>&copy; 2026 日藥指南. All rights reserved.</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
