<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日藥指南 | 日本藥妝與常備藥知識分享</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sakura: { 50: '#fdf2f8', 100: '#fce7f3', 200: '#fbcfe8', 300: '#f9a8d4', 500: '#ec4899', 600: '#db2777' },
                        medical: { 50: '#f0fdf4', 500: '#22c55e', 600: '#16a34a' } 
                    },
                    fontFamily: { sans: ['"Noto Sans TC"', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .hover-card { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .hover-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        html { scroll-behavior: smooth; }
        .content-section { scroll-margin-top: 140px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .admin-sidebar-active { background-color: #ec4899; color: white; }
    </style>
</head>
<body class="text-slate-800 antialiased">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect, useCallback } = React;

        const ADMIN_HASH = "d5dbb48255049debcaa47af8d5ea8debe852462925c650a75b3756614e7ab1c6";
        const APP_ID = "nippondrug";

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message.toLowerCase().trim());
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // --- 視圖：後台登入畫面 ---
        const AdminLoginView = ({ setView, authError }) => {
            const [isLoading, setIsLoading] = useState(false);
            const [localError, setLocalError] = useState('');

            const handleGoogleLogin = async () => {
                setIsLoading(true);
                setLocalError('');
                const auth = getAuth();
                const provider = new GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                
                try {
                    await signInWithPopup(auth, provider);
                } catch (e) {
                    setLocalError('登入過程發生錯誤：' + e.message);
                    setIsLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col justify-center py-12 px-4">
                    <div className="sm:mx-auto sm:w-full sm:max-w-md text-center">
                        <div className="flex justify-center mb-6 text-sakura-500 text-6xl"><i className="fa-solid fa-shield-halved"></i></div>
                        <h2 className="text-3xl font-black text-slate-900 mb-2">管理員身分確認</h2>
                        <p className="text-slate-500 mb-8">請使用授權的 Google 帳號進行登入</p>
                        <div className="bg-white py-10 px-6 shadow-xl rounded-2xl border border-slate-200">
                            <button onClick={handleGoogleLogin} disabled={isLoading} className="w-full flex items-center justify-center gap-3 bg-white border border-slate-300 text-slate-700 font-bold py-3 px-4 rounded-lg hover:bg-slate-50 transition shadow-sm disabled:opacity-50">
                                {isLoading ? <i className="fa-solid fa-circle-notch fa-spin"></i> : <img src="https://www.gstatic.com/images/branding/product/1x/googleg_48dp.png" className="w-5 h-5" />}
                                使用 Google 帳號登入
                            </button>
                            {(authError || localError) && (
                                <div className="mt-4 p-4 bg-red-50 text-red-600 text-sm rounded-lg border border-red-100 text-left">
                                    <p className="font-bold flex items-center mb-2"><i className="fa-solid fa-circle-exclamation mr-2"></i> 身分驗證未通過</p>
                                    <p className="whitespace-pre-wrap break-all opacity-80 leading-relaxed">{authError || localError}</p>
                                </div>
                            )}
                            <div className="mt-8 pt-6 border-t border-slate-100">
                                <button onClick={() => setView('home')} className="text-slate-400 hover:text-sakura-500 text-sm font-medium"><i className="fa-solid fa-arrow-left mr-1"></i> 返回前台首頁</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 視圖：前台首頁 ---
        const HomeView = ({ products, setView, setActiveProduct }) => (
            <div className="animate-in fade-in duration-500">
                <header className="relative pt-32 pb-24 overflow-hidden bg-sakura-50">
                    <div className="max-w-7xl mx-auto px-4 text-center">
                        <span className="text-sakura-500 font-semibold tracking-wider text-sm mb-4 block uppercase tracking-widest">專業解析，安心選購</span>
                        <h1 className="text-4xl md:text-5xl font-black text-slate-900 mb-6 leading-tight">
                            日本藥妝與保養品知識庫 <br/>
                            <span className="text-transparent bg-clip-text bg-gradient-to-r from-sakura-500 to-orange-400">成分解析與評價指南</span>
                        </h1>
                    </div>
                </header>

                <section className="py-16 bg-white min-h-screen">
                    <div className="max-w-7xl mx-auto px-4 text-center mb-10">
                        <h2 className="text-2xl font-bold text-slate-900 mb-2">產品解析目錄</h2>
                        <div className="w-12 h-1 bg-sakura-500 mx-auto rounded-full"></div>
                    </div>
                    <div className="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-8">
                        {products.map(product => (
                            <article key={product.id} onClick={() => { setActiveProduct(product); setView('productDetail'); }} 
                                     className="bg-white rounded-2xl overflow-hidden shadow-sm hover-card border border-slate-100 flex flex-col cursor-pointer">
                                <div className="relative h-52 overflow-hidden bg-slate-50 flex justify-center items-center p-4 border-b border-slate-100">
                                    <img src={product.image || "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?auto=format&fit=crop&w=400&q=80"} alt={product.name} className="max-h-full object-contain rounded" />
                                    <div className="absolute top-4 left-4 bg-sakura-500 text-white text-xs font-bold px-2 py-1 rounded shadow-sm">
                                        {product.classification}
                                    </div>
                                </div>
                                <div className="p-6 flex-grow flex flex-col">
                                    <div className="text-xs font-bold text-slate-400 mb-1">{product.brand}</div>
                                    <h3 className="text-xl font-bold text-slate-900 mb-2 hover:text-sakura-500 line-clamp-2">{product.name}</h3>
                                    <div className="flex flex-wrap gap-1 mb-3">
                                        {(product.tags ? product.tags.split(',') : []).slice(0,3).map((tag, i) => (
                                            <span key={i} className="bg-slate-100 text-slate-500 px-2 py-0.5 rounded text-[10px]">{tag.trim()}</span>
                                        ))}
                                    </div>
                                    <p className="text-slate-600 text-sm line-clamp-3 mt-auto">{product.description}</p>
                                </div>
                            </article>
                        ))}
                        {products.length === 0 && <div className="col-span-full text-center py-20 text-slate-400 italic">目前尚無資料，請進入後台新增</div>}
                    </div>
                </section>
            </div>
        );

        // --- 視圖：前台詳細頁 ---
        const ProductDetailView = ({ product, setView }) => {
            const [activeTab, setActiveTab] = useState('dosage');

            useEffect(() => {
                const handleScroll = () => {
                    const sections = ['dosage', 'analysis', 'usage'];
                    let current = sections[0];
                    for (const id of sections) {
                        const element = document.getElementById(id);
                        if (element && window.scrollY >= (element.offsetTop - 160)) {
                            current = id;
                        }
                    }
                    setActiveTab(current);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            if(!product) return null;

            // 輔助解析資料的函數
            const parseList = (text) => text ? text.split('\n').filter(t => t.trim()) : [];
            const tags = product.tags ? product.tags.split(',').filter(t => t.trim()) : [];
            const coreFeatures = parseList(product.coreFeatures);
            
            let displayIngredients = [];
            if (product.ingredientsList && Array.isArray(product.ingredientsList)) {
                displayIngredients = product.ingredientsList;
            } else if (product.ingredientsText) {
                displayIngredients = parseList(product.ingredientsText).map(line => {
                    const parts = line.split('|');
                    return { type: 'core', name: parts[0] || '', desc: parts[1] || '', safety: parts[2] || '高 / 安全', amount: '' };
                });
            }

            const suitableFor = parseList(product.suitableFor);
            const notSuitableFor = parseList(product.notSuitableFor);
            const dosageSteps = parseList(product.dosageSteps).map(line => {
                const parts = line.split('|');
                return { title: parts[0] || '', desc: parts[1] || '' };
            });

            return (
                <div className="bg-slate-50 min-h-screen animate-in slide-in-from-bottom-4 duration-500 pb-20">
                    {/* 麵包屑導覽 */}
                    <div className="pt-24 pb-4 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <nav className="flex text-sm text-slate-500" aria-label="Breadcrumb">
                            <ol className="inline-flex items-center space-x-1 md:space-x-3">
                                <li className="inline-flex items-center">
                                    <button onClick={() => setView('home')} className="hover:text-sakura-500 transition-colors flex items-center">
                                        <i className="fa-solid fa-home mr-2"></i>首頁
                                    </button>
                                </li>
                                <li>
                                    <div className="flex items-center">
                                        <i className="fa-solid fa-chevron-right text-xs mx-2"></i>
                                        <span className="hover:text-sakura-500 transition-colors cursor-pointer">{product.classification}</span>
                                    </div>
                                </li>
                                <li aria-current="page">
                                    <div className="flex items-center">
                                        <i className="fa-solid fa-chevron-right text-xs mx-2"></i>
                                        <span className="text-slate-800 font-medium line-clamp-1">{product.name}</span>
                                    </div>
                                </li>
                            </ol>
                        </nav>
                    </div>

                    {/* 產品簡介區塊 (Product Hero) */}
                    <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mb-12">
                        <div className="bg-white rounded-3xl p-6 md:p-10 shadow-sm border border-slate-100 flex flex-col md:flex-row gap-10">
                            
                            {/* 產品圖片 (左側) */}
                            <div className="w-full md:w-2/5 flex flex-col items-center">
                                <div className="relative w-full aspect-square bg-slate-50 rounded-2xl overflow-hidden flex items-center justify-center p-8 border border-slate-100">
                                    <img src={product.image || "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?auto=format&fit=crop&w=800&q=80"} alt={product.name} className="max-w-full max-h-full object-contain hover:scale-105 transition-transform duration-500" />
                                </div>
                            </div>

                            {/* 產品資訊 (右側) */}
                            <div className="w-full md:w-3/5 flex flex-col justify-center">
                                <div className="text-sm font-bold text-sakura-500 mb-2 tracking-wider">{product.brand}</div>
                                <h1 className="text-2xl md:text-3xl lg:text-4xl font-bold text-slate-900 mb-4 leading-tight flex flex-col gap-2">
                                    <span>{product.name}</span>
                                    {product.jpName && <span className="text-lg md:text-xl text-slate-500 font-medium">{product.jpName}</span>}
                                </h1>
                                
                                <div className="flex flex-wrap gap-2 mb-6">
                                    {tags.map((tag, i) => (
                                        <span key={i} className="bg-blue-50 text-blue-600 border border-blue-200 px-3 py-1 rounded-full text-xs font-medium">{tag.trim()}</span>
                                    ))}
                                </div>

                                <p className="text-slate-600 mb-8 leading-relaxed whitespace-pre-wrap">{product.description}</p>

                                {coreFeatures.length > 0 && (
                                    <div className="bg-slate-50 rounded-xl p-4 mb-8 border border-slate-100">
                                        <div className="font-bold text-slate-800 text-sm mb-2 flex items-center">
                                            <i className="fa-solid fa-flask text-sakura-500 mr-2"></i> 核心作用亮點
                                        </div>
                                        <ul className="text-sm text-slate-600 space-y-1">
                                            {coreFeatures.map((feat, i) => (
                                                <li key={i}><i className="fa-solid fa-check text-green-500 mr-2"></i> <b>{feat.split('：')[0]}</b>{feat.includes('：') ? '：' + feat.split('：').slice(1).join('：') : ''}</li>
                                            ))}
                                        </ul>
                                    </div>
                                )}

                                <div className="flex items-center gap-4 mt-auto">
                                    <button className="bg-sakura-500 hover:bg-sakura-600 text-white font-medium py-3 px-8 rounded-full transition-colors shadow-lg shadow-sakura-500/30 flex-grow md:flex-grow-0 flex items-center justify-center">
                                        <i className="fa-regular fa-bookmark mr-2"></i> 收藏此產品
                                    </button>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* 頁籤導覽 (Sticky 效果) */}
                    <div className="sticky top-20 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm mb-8 transition-all">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex overflow-x-auto no-scrollbar space-x-8">
                                <a href="#dosage" className={`py-4 whitespace-nowrap border-b-2 transition-colors ${activeTab==='dosage' ? 'text-sakura-500 font-bold border-sakura-500' : 'text-slate-500 font-medium border-transparent hover:text-sakura-500 hover:border-sakura-300'}`}>用法用量</a>
                                <a href="#analysis" className={`py-4 whitespace-nowrap border-b-2 transition-colors ${activeTab==='analysis' ? 'text-sakura-500 font-bold border-sakura-500' : 'text-slate-500 font-medium border-transparent hover:text-sakura-500 hover:border-sakura-300'}`}>成分解析</a>
                                <a href="#usage" className={`py-4 whitespace-nowrap border-b-2 transition-colors ${activeTab==='usage' ? 'text-sakura-500 font-bold border-sakura-500' : 'text-slate-500 font-medium border-transparent hover:text-sakura-500 hover:border-sakura-300'}`}>使用方式與建議</a>
                            </div>
                        </div>
                    </div>

                    {/* 內容主體區塊 - 全寬配置 */}
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="w-full space-y-16">
                            
                            {/* 用法用量 */}
                            {product.dosageInstruction && (
                                <section id="dosage" className="content-section">
                                    <h2 className="text-2xl font-bold text-slate-900 mb-6 flex items-center">
                                        <span className="w-1.5 h-6 bg-sakura-500 rounded-full mr-3"></span> 用法用量
                                    </h2>
                                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                        <p className="text-slate-700 leading-relaxed whitespace-pre-wrap">{product.dosageInstruction}</p>
                                    </div>
                                </section>
                            )}

                            {/* 成分解析 */}
                            <section id="analysis" className="content-section">
                                <h2 className="text-2xl font-bold text-slate-900 mb-6 flex items-center">
                                    <span className="w-1.5 h-6 bg-sakura-500 rounded-full mr-3"></span> 成分解析
                                </h2>
                                <div className="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
                                    <table className="w-full text-left text-sm">
                                        <thead className="bg-slate-50 text-slate-700">
                                            <tr>
                                                <th className="px-6 py-4 font-bold border-b border-slate-200 w-1/4">成分名稱</th>
                                                <th className="px-6 py-4 font-bold border-b border-slate-200 w-32">含量</th>
                                                <th className="px-6 py-4 font-bold border-b border-slate-200">主要功效與機轉</th>
                                                <th className="px-6 py-4 font-bold border-b border-slate-200 w-32">標籤/安心度</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {displayIngredients.map((ing, i) => (
                                                <tr key={i} className="hover:bg-slate-50/50">
                                                    <td className="px-6 py-4">
                                                        <div className="font-bold text-slate-800">{ing.name}</div>
                                                        {ing.type === 'additive' && <div className="text-[10px] text-slate-400 mt-1">添加物</div>}
                                                    </td>
                                                    <td className="px-6 py-4 font-medium text-sakura-500">{ing.amount || '-'}</td>
                                                    <td className="px-6 py-4 text-slate-600">{ing.desc}</td>
                                                    <td className="px-6 py-4">
                                                        <span className={`px-2 py-1 rounded text-xs font-bold whitespace-nowrap ${(ing.safety||'').includes('注意')||(ing.safety||'').includes('中') ? 'bg-yellow-100 text-yellow-700' : 'bg-green-100 text-green-700'}`}>{ing.safety || '高 / 安全'}</span>
                                                    </td>
                                                </tr>
                                            ))}
                                            {displayIngredients.length === 0 && <tr><td colSpan="4" className="px-6 py-8 text-center text-slate-400">尚無成分資料</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                            </section>

                            {/* 使用方式與建議 */}
                            <section id="usage" className="content-section">
                                <h2 className="text-2xl font-bold text-slate-900 mb-6 flex items-center">
                                    <span className="w-1.5 h-6 bg-sakura-500 rounded-full mr-3"></span> 使用方式與受眾建議
                                </h2>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                                    <div className="bg-sakura-50 rounded-2xl p-6 border border-sakura-100">
                                        <h3 className="font-bold text-sakura-600 text-lg mb-3 flex items-center"><i className="fa-regular fa-face-smile mr-2"></i> 最適合這些人</h3>
                                        <ul className="space-y-2 text-slate-700">
                                            {suitableFor.map((item, i) => <li key={i}><i className="fa-solid fa-check text-sakura-500 mr-2"></i> {item}</li>)}
                                            {suitableFor.length===0 && <li className="text-slate-400 italic">無特定建議</li>}
                                        </ul>
                                    </div>
                                    <div className="bg-slate-50 rounded-2xl p-6 border border-slate-200">
                                        <h3 className="font-bold text-slate-600 text-lg mb-3 flex items-center"><i className="fa-regular fa-face-frown mr-2"></i> 較不適合/需注意</h3>
                                        <ul className="space-y-2 text-slate-700">
                                            {notSuitableFor.map((item, i) => <li key={i}><i className="fa-solid fa-xmark text-slate-400 mr-2"></i> {item}</li>)}
                                            {notSuitableFor.length===0 && <li className="text-slate-400 italic">無特定禁忌</li>}
                                        </ul>
                                    </div>
                                </div>

                                {dosageSteps.length > 0 && (
                                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                        <h3 className="font-bold text-slate-800 mb-4 text-lg">💡 建議用法步驟</h3>
                                        <div className="grid grid-cols-1 gap-4">
                                            {dosageSteps.map((step, i) => (
                                                <div key={i} className="flex">
                                                    <div className="flex-shrink-0 w-8 h-8 rounded-full bg-sakura-100 text-sakura-500 flex items-center justify-center font-bold mr-4">{i+1}</div>
                                                    <div>
                                                        <p className="text-slate-700 font-medium">{step.title}</p>
                                                        <p className="text-sm text-slate-500 mt-1">{step.desc}</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </section>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 視圖：通用列表管理元件 ---
        const GenericDataManager = ({ title, collectionName, items }) => {
            const [inputValue, setInputValue] = useState('');
            const handleAdd = async (e) => {
                e.preventDefault();
                if (!inputValue.trim()) return;
                const collRef = collection(window.db, 'artifacts', APP_ID, 'public', 'data', collectionName);
                try {
                    await addDoc(collRef, { name: inputValue.trim(), createdAt: Date.now() });
                    setInputValue('');
                } catch (e) { alert("新增失敗"); }
            };
            const handleDelete = async (id) => {
                if(confirm(`確定刪除此${title}？`)) {
                    await deleteDoc(doc(window.db, 'artifacts', APP_ID, 'public', 'data', collectionName, id));
                }
            };

            return (
                <div className="bg-white rounded-2xl p-8 shadow-md border border-slate-200">
                    <h2 className="text-2xl font-black text-slate-800 mb-6">{title}管理庫</h2>
                    <form onSubmit={handleAdd} className="flex gap-3 mb-8">
                        <input placeholder={`輸入新${title}名稱...`} value={inputValue} onChange={e => setInputValue(e.target.value)} className="flex-grow border-2 border-slate-100 p-3 rounded-xl focus:border-sakura-500 outline-none transition font-bold" />
                        <button type="submit" className="bg-sakura-500 text-white px-6 py-2.5 rounded-xl font-black shadow-lg hover:bg-sakura-600 transition">快速建立</button>
                    </form>
                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                        {items.map(item => (
                            <div key={item.id} className="bg-slate-50 border border-slate-100 p-3 rounded-xl flex justify-between items-center group hover:border-sakura-200 transition">
                                <span className="font-bold text-slate-700">{item.name}</span>

            const handleSave = async (e) => {

            const handleDelete = async (id) => {

                                            <div className="space-y-3">
                                                {(formData.ingredientsList || []).map((ing, i) => (
                                                    <div key={i} className="flex flex-wrap md:flex-nowrap gap-3 items-start bg-white p-4 rounded-lg border border-slate-200 shadow-sm relative group">
                                                        <div className="w-full md:w-1/4">
                                                            <label className="block text-[10px] font-bold text-slate-400 mb-1">{ing.type === 'core' ? '選擇成分 (來自資料庫)' : '手動輸入成分名稱'}</label>

                                                                <select value={ing.name} onChange={e=>updateIngredient(i, 'name', e.target.value)} className="w-full p-2 rounded-lg border bg-slate-50 focus:border-sakura-500 text-sm font-medium outline-none">
                                                                    <option value="">請選擇...</option>

                                                                <input value={ing.name} onChange={e=>updateIngredient(i, 'name', e.target.value)} placeholder="如：防腐劑、香料" className="w-full p-2 rounded-lg border bg-slate-50 focus:border-sakura-500 text-sm font-medium outline-none" />
                                                            )}
                                                        </div>
                                                        <div className="w-full md:w-1/6">
                                                            <label className="block text-[10px] font-bold text-slate-400 mb-1">含量 (選填)</label>
                                                            <input value={ing.amount} onChange={e=>updateIngredient(i, 'amount', e.target.value)} placeholder="例: 77% 或 適量" className="w-full p-2 rounded-lg border bg-slate-50 focus:border-sakura-500 text-sm font-medium outline-none" />
                                                        </div>
                                                        <div className="w-full md:w-1/3">
                                                            <label className="block text-[10px] font-bold text-slate-400 mb-1">主要功效與機轉</label>
                                                            <input value={ing.desc} onChange={e=>updateIngredient(i, 'desc', e.target.value)} placeholder="例: 優異的舒緩效果" className="w-full p-2 rounded-lg border bg-slate-50 focus:border-sakura-500 text-sm font-medium outline-none" />
                                                        </div>
                                                        <div className="w-full md:w-1/6">
                                                            <label className="block text-[10px] font-bold text-slate-400 mb-1">安心度</label>
                                                            <select value={ing.safety} onChange={e=>updateIngredient(i, 'safety', e.target.value)} className="w-full p-2 rounded-lg border bg-slate-50 focus:border-sakura-500 text-sm font-medium outline-none">
                                                                <option value="高 / 安全">高 / 安全</option>
                                                                <option value="中 / 注意">中 / 注意</option>
                                                                <option value="低 / 警告">低 / 警告</option>
                                                            </select>
                                                        </div>
                                                        <button type="button" onClick={() => removeIngredient(i)} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shadow-md hover:bg-red-600 opacity-0 group-hover:opacity-100 transition-opacity"><i className="fa-solid fa-xmark"></i></button>
                                                    </div>
                                                ))}
                                                {!(formData.ingredientsList?.length) && <div className="text-center py-8 bg-slate-50 border-2 border-dashed border-slate-200 rounded-xl text-slate-400 text-sm font-bold">目前尚未建立成分清單，請點擊上方按鈕新增</div>}
                                            </div>
                                        </div>
                                    </div>

                                    {/* 使用方式與對象 */}
                                    <div className="bg-slate-50 p-6 rounded-xl border border-slate-100 space-y-4">
                                        <h3 className="font-bold text-slate-700 flex items-center"><i className="fa-regular fa-face-smile mr-2 text-sakura-500"></i> 受眾與用法指導</h3>

                                                <label className="block text-xs font-black text-slate-500 mb-1">較不適合對象 (每行一點)</label>

                                            </div>
                                        </div>
                                        <div>

                        {activeTab === 'brands' && <GenericDataManager title="品牌管理" collectionName="brands" items={brands} />}

        };

        // --- 核心 App 元件 ---
        const App = () => {
            const [view, setView] = useState('home');
            const [products, setProducts] = useState([]);
            const [brands, setBrands] = useState([]);
            const [categories, setCategories] = useState([]);
            const [ingredients, setIngredients] = useState([]);
            
            const [activeProduct, setActiveProduct] = useState(null);
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [authError, setAuthError] = useState('');
            const [dbReady, setDbReady] = useState(false);

            useEffect(() => { window.scrollTo(0, 0); }, [view]);

            useEffect(() => {
                const firebaseConfig = {
                    apiKey: "AIzaSyDQ3jh6JLTAEEedCNaev_7wuDzSrX9rdJw",
                    authDomain: "nippondrug.firebaseapp.com",
                    projectId: "nippondrug",
                    storageBucket: "nippondrug.firebasestorage.app",
                    messagingSenderId: "872135164108",
                    appId: "1:872135164108:web:7b7de05ff82f3166400269"
                };
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                window.db = getFirestore(app);

                signInAnonymously(auth).catch(e => console.error(e));

                onAuthStateChanged(auth, async (u) => {
                    if (u && !u.isAnonymous) {
                        const emailHash = await sha256(u.email);
                        if (emailHash === ADMIN_HASH) {
                            setIsAuthenticated(true);
                            setAuthError('');
                            setView('admin');
                        } else {
                            setIsAuthenticated(false);
                            setAuthError(`身分驗證失敗：帳號 ${u.email.substring(0,3)}**** 沒有管理員權限。`);
                            await signOut(auth);
                        }
                    } else {
                        setIsAuthenticated(false);
                    }
                    setDbReady(true);
                });
            }, []);

            useEffect(() => {
                if (!dbReady) return;
                const path = (name) => collection(window.db, 'artifacts', APP_ID, 'public', 'data', name);
                
                const unsubProducts = onSnapshot(path('products'), (snap) => setProducts(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubBrands = onSnapshot(path('brands'), (snap) => setBrands(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubCategories = onSnapshot(path('categories'), (snap) => setCategories(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubIngredients = onSnapshot(path('ingredients'), (snap) => setIngredients(snap.docs.map(d => ({id: d.id, ...d.data()}))));

                return () => { unsubProducts(); unsubBrands(); unsubCategories(); unsubIngredients(); };
            }, [dbReady]);

            const renderContent = () => {
                if (view === 'admin' && isAuthenticated) return <AdminDashboard products={products} brands={brands} categories={categories} ingredients={ingredients} setView={setView} />;
                if (view === 'admin' || view === 'adminLogin') return <AdminLoginView setView={setView} authError={authError} />;
                if (view === 'productDetail') return <ProductDetailView product={activeProduct} setView={setView} />;
                return <HomeView products={products} setView={setView} setActiveProduct={setActiveProduct} />;
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {view !== 'admin' && view !== 'adminLogin' && (
                        <nav className="fixed w-full z-50 top-0 bg-white/90 backdrop-blur shadow-md transition-all">
                            <div className="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
                                <div onClick={() => setView('home')} className="cursor-pointer flex items-center group">
                                    <i className="fa-solid fa-leaf text-sakura-500 text-2xl mr-2 group-hover:rotate-12 transition-transform duration-300"></i>
                                    <span className="font-black text-2xl text-slate-800">日藥<span className="text-sakura-500">指南</span></span>
                                </div>
                                <div className="flex gap-4">
                                    <button onClick={() => setView(isAuthenticated ? 'admin' : 'adminLogin')} className={`${isAuthenticated ? 'bg-sakura-500 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'} px-5 py-2 rounded-full text-sm font-bold transition flex items-center`}>
                                        <i className={`fa-solid ${isAuthenticated ? 'fa-user-shield' : 'fa-gear'} mr-2`}></i> 
                                        {isAuthenticated ? '進入後台' : '管理員'}
                                    </button>
                                </div>
                            </div>
                        </nav>
                    )}
                    <div className="flex-grow">{renderContent()}</div>
                    <footer className="bg-slate-900 text-slate-500 py-12 text-center text-xs">
                        <p className="font-bold">© 2026 日藥指南 Wa-Cosme Guide</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
